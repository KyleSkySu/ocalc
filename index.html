<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>複利投資模擬與目標倒推計算器</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --input-bg: #334155;
      --accent: #38bdf8;
      --accent-green: #34d399;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 980px;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h2 {
      margin-top: 0;
      color: var(--accent);
      font-size: 22px;
      text-align: center;
      margin-bottom: 20px;
    }
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 22px;
      background: #0b1120;
      padding: 6px;
      border-radius: 12px;
    }
    .tab-btn {
      flex: 1;
      padding: 12px;
      border: none;
      background: transparent;
      color: var(--text-sub);
      font-size: 15px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #0f172a;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }
    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
    .control-group {
      background: var(--input-bg);
      padding: 16px;
      border-radius: 10px;
    }
    label {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
    }
    .input-row {
      display: flex;
      gap: 8px;
    }
    select, input[type="number"] {
      background: #0f172a;
      color: #fff;
      border: 1px solid #475569;
      padding: 10px;
      border-radius: 6px;
      font-size: 15px;
      box-sizing: border-box;
    }
    input[type="number"] {
      flex: 1;
    }
    select {
      min-width: 90px;
    }
    input[type="range"] {
      width: 100%;
      margin-top: 10px;
      accent-color: var(--accent);
    }
    .preset-container {
      grid-column: span 2;
      background: #1e293b;
      border: 1px solid #334155;
      padding: 14px;
      border-radius: 10px;
    }
    @media (max-width: 768px) {
      .preset-container {
        grid-column: span 1;
      }
    }
    .preset-title {
      font-size: 13px;
      color: var(--text-sub);
      margin-bottom: 8px;
      font-weight: 600;
    }
    .preset-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .chip {
      background: #0f172a;
      border: 1px solid #475569;
      color: #e2e8f0;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .chip:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .summary-grid {
      grid-column: span 2;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin-top: 6px;
    }
    @media (max-width: 768px) {
      .summary-grid {
        grid-column: span 1;
        grid-template-columns: 1fr;
      }
    }
    .summary-card {
      background: #0284c7;
      color: #fff;
      padding: 14px 18px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .summary-card.secondary {
      background: #334155;
      border: 1px solid #475569;
    }
    .summary-title {
      font-size: 13px;
      opacity: 0.9;
      margin-bottom: 4px;
    }
    .summary-value {
      font-size: 22px;
      font-weight: 700;
      word-break: break-all;
    }
    .chart-box {
      position: relative;
      height: 420px;
      width: 100%;
      margin-top: 10px;
    }
    /* 倒推目標計算頁樣式 */
    .goal-banner {
      background: linear-gradient(135deg, #0369a1, #0f766e);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      text-align: center;
    }
    .goal-result-title {
      font-size: 15px;
      margin-bottom: 6px;
      color: #e0f2fe;
    }
    .goal-result-highlight {
      font-size: 32px;
      font-weight: 800;
      color: #38f8d4;
    }
    .goal-desc {
      font-size: 14px;
      color: #f0fdfa;
      margin-top: 6px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>投資動態模擬與目標倒推計算器</h2>

  <!-- 導航切換按鈕 -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('forwardTab', this)">動態複利模擬與回測</button>
    <button class="tab-btn" onclick="switchTab('backwardTab', this)">財務目標逆推計算</button>
  </div>

  <!-- 分頁一：動態複利模擬與簡易回測 -->
  <div id="forwardTab" class="tab-content active">
    <div class="grid">
      <!-- 簡易歷史回測標籤 -->
      <div class="preset-container">
        <div class="preset-title">簡易大盤與策略長期回測（點選一鍵套用年化報酬）：</div>
        <div class="preset-chips">
          <button class="chip" onclick="applyRate(8.5)">全球全市場 (8.5%)</button>
          <button class="chip" onclick="applyRate(10.5)">美股標普 500 (10.5%)</button>
          <button class="chip" onclick="applyRate(11.2)">台股大盤含息 (11.2%)</button>
          <button class="chip" onclick="applyRate(16.8)">科技巨擘 QQQ (16.8%)</button>
          <button class="chip" onclick="applyRate(25.0)">主動成長組合 (25.0%)</button>
        </div>
      </div>

      <!-- 起始本金 / 總資產 -->
      <div class="control-group">
        <label>
          <span>起始本金 / 現有總資產</span>
          <span id="pvDisplay">180 萬</span>
        </label>
        <div class="input-row">
          <input type="number" id="pvInput" value="180" min="0" step="any">
          <select id="currencySelect">
            <option value="TWD" selected>台幣 (TWD)</option>
            <option value="USD">美金 (USD)</option>
          </select>
          <select id="pvMagnitudeSelect">
            <option value="10000" selected>萬</option>
            <option value="1000000">百萬</option>
            <option value="100000000">億</option>
          </select>
        </div>
      </div>

      <!-- 每月定期定額金額 -->
      <div class="control-group">
        <label>
          <span>每月定期定額投入</span>
          <span id="pmtDisplay">0 萬</span>
        </label>
        <div class="input-row">
          <input type="number" id="pmtInput" value="0" min="0" step="any">
          <select id="pmtMagnitudeSelect">
            <option value="100">百</option>
            <option value="1000">千</option>
            <option value="10000" selected>萬</option>
            <option value="1000000">百萬</option>
            <option value="100000000">億</option>
          </select>
        </div>
      </div>

      <!-- 年化報酬率 -->
      <div class="control-group">
        <label>
          <span>預期年化報酬率 (CAGR)</span>
          <span id="rateDisplay">10.5 %</span>
        </label>
        <input type="number" id="rateInput" value="10.5" min="0" max="100" step="0.1">
        <input type="range" id="rateSlider" min="1" max="50" step="0.5" value="10.5">
      </div>

      <!-- 計算年數 -->
      <div class="control-group">
        <label>
          <span>複利滾動年數 (Horizon)</span>
          <span id="yearsDisplay">10 年</span>
        </label>
        <input type="number" id="yearsInput" value="10" min="1" max="60" step="1">
        <input type="range" id="yearsSlider" min="1" max="50" step="1" value="10">
      </div>

      <!-- 結果看板 -->
      <div class="summary-grid">
        <div class="summary-card">
          <div class="summary-title">最終預估總資產</div>
          <div class="summary-value" id="finalValueDisplay">0</div>
        </div>
        <div class="summary-card secondary">
          <div class="summary-title">累計總投入本金 (原始+定期)</div>
          <div class="summary-value" id="totalPrincipalDisplay" style="color: #cbd5e1;">0</div>
        </div>
        <div class="summary-card secondary">
          <div class="summary-title">累計複利淨收益 (資本利得)</div>
          <div class="summary-value" id="totalInterestDisplay" style="color: var(--accent-green);">0</div>
        </div>
      </div>
    </div>

    <div class="chart-box">
      <canvas id="growthChart"></canvas>
    </div>
  </div>

  <!-- 分頁二：財務目標逆推計算 -->
  <div id="backwardTab" class="tab-content">
    <div class="goal-banner">
      <div class="goal-result-title" id="goalResultTitle">達成目標所需要的條件</div>
      <div class="goal-result-highlight" id="goalResultPrimary">--</div>
      <div class="goal-desc" id="goalResultSub">請確認下方參數</div>
    </div>

    <div class="grid">
      <div class="control-group" style="grid-column: span 2;">
        <label><span>選擇倒推計算目標</span></label>
        <select id="goalMode" onchange="calculateGoal()" style="width: 100%;">
          <option value="solveRate">模式一：給定「每月預計存多少」，反推【需要幾 % 年化報酬率】</option>
          <option value="solvePmt">模式二：給定「預期報酬率 %」，反推【每個月要存多少錢】</option>
        </select>
      </div>

      <!-- 1. 目標總資產 -->
      <div class="control-group">
        <label><span>未來目標金額 (FV)</span></label>
        <div class="input-row">
          <input type="number" id="targetFvInput" value="1000" min="0" step="any" oninput="calculateGoal()">
          <select id="targetFvMagnitude" onchange="calculateGoal()">
            <option value="10000">萬</option>
            <option value="1000000">百萬</option>
            <option value="100000000">億</option>
          </select>
        </div>
      </div>

      <!-- 2. 現有初始本金 -->
      <div class="control-group">
        <label><span>現在已有本金 (PV)</span></label>
        <div class="input-row">
          <input type="number" id="goalPvInput" value="100" min="0" step="any" oninput="calculateGoal()">
          <select id="goalPvMagnitude" onchange="calculateGoal()">
            <option value="10000">萬</option>
            <option value="1000000">百萬</option>
            <option value="100000000">億</option>
          </select>
        </div>
      </div>

      <!-- 3. 目標年數 -->
      <div class="control-group">
        <label><span>預計達成年數 (年)</span></label>
        <input type="number" id="goalYearsInput" value="10" min="1" max="50" step="1" oninput="calculateGoal()">
      </div>

      <!-- 4. 動態參數：每月投入 或 預期報酬率 -->
      <div class="control-group" id="goalDynamicGroup">
        <label><span id="goalDynamicLabel">每月預計定期定額投入</span></label>
        <div class="input-row" id="goalPmtInputContainer">
          <input type="number" id="goalPmtInput" value="3" min="0" step="any" oninput="calculateGoal()">
          <select id="goalPmtMagnitude" onchange="calculateGoal()">
            <option value="1000">千</option>
            <option value="10000" selected>萬</option>
            <option value="1000000">百萬</option>
          </select>
        </div>
        <div id="goalRateInputContainer" style="display:none;">
          <input type="number" id="goalExpectedRate" value="10.5" min="0" max="100" step="0.1" oninput="calculateGoal()" style="width:100%;">
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  function switchTab(tabId, btn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(tabId).classList.add('active');
    if (tabId === 'forwardTab' && chartInstance) {
      setTimeout(() => {
        chartInstance.resize();
      }, 50);
    }
    if (tabId === 'backwardTab') {
      calculateGoal();
    }
  }

  // --- 分頁一：正向模擬與回測標籤 ---
  const pvInput = document.getElementById('pvInput');
  const currencySelect = document.getElementById('currencySelect');
  const pvMagnitudeSelect = document.getElementById('pvMagnitudeSelect');
  const pmtInput = document.getElementById('pmtInput');
  const pmtMagnitudeSelect = document.getElementById('pmtMagnitudeSelect');
  const rateSlider = document.getElementById('rateSlider');
  const rateInput = document.getElementById('rateInput');
  const yearsSlider = document.getElementById('yearsSlider');
  const yearsInput = document.getElementById('yearsInput');

  const pvDisplay = document.getElementById('pvDisplay');
  const pmtDisplay = document.getElementById('pmtDisplay');
  const rateDisplay = document.getElementById('rateDisplay');
  const yearsDisplay = document.getElementById('yearsDisplay');

  const finalValueDisplay = document.getElementById('finalValueDisplay');
  const totalPrincipalDisplay = document.getElementById('totalPrincipalDisplay');
  const totalInterestDisplay = document.getElementById('totalInterestDisplay');

  let chartInstance = null;

  function applyRate(val) {
    rateInput.value = val;
    rateSlider.value = val;
    calculateTrajectory();
  }

  function formatMoneyWithUnit(amount, currency) {
    if (amount >= 100000000) {
      return (amount / 100000000).toFixed(2) + ' 億 ' + currency;
    } else if (amount >= 10000) {
      return (amount / 10000).toFixed(2) + ' 萬 ' + currency;
    } else {
      return Math.round(amount).toLocaleString() + ' ' + currency;
    }
  }

  function calculateTrajectory() {
    const rawPv = parseFloat(pvInput.value) || 0;
    const pvMag = parseFloat(pvMagnitudeSelect.value);
    const initialPrincipal = rawPv * pvMag;

    const rawPmt = parseFloat(pmtInput.value) || 0;
    const pmtMag = parseFloat(pmtMagnitudeSelect.value);
    const monthlyContribution = rawPmt * pmtMag;

    const annualRate = (parseFloat(rateInput.value) || 0) / 100;
    const monthlyRate = annualRate / 12;
    const years = parseInt(yearsInput.value, 10) || 1;

    const currency = currencySelect.value;
    const pvMagText = pvMagnitudeSelect.options[pvMagnitudeSelect.selectedIndex].text;
    const pmtMagText = pmtMagnitudeSelect.options[pmtMagnitudeSelect.selectedIndex].text;

    pvDisplay.textContent = `${rawPv.toLocaleString()} ${pvMagText}`;
    pmtDisplay.textContent = `${rawPmt.toLocaleString()} ${pmtMagText}`;
    rateDisplay.textContent = `${(annualRate * 100).toFixed(1)} %`;
    yearsDisplay.textContent = `${years} 年`;

    const labels = [];
    const assetData = [];
    const principalData = [];

    let currentBalance = initialPrincipal;
    let accumulatedPrincipal = initialPrincipal;

    labels.push('第 0 年');
    assetData.push((currentBalance / pvMag).toFixed(2));
    principalData.push((accumulatedPrincipal / pvMag).toFixed(2));

    for (let y = 1; y <= years; y++) {
      labels.push(`第 ${y} 年`);
      for (let m = 1; m <= 12; m++) {
        // 月初投入普通年金模型
        currentBalance = (currentBalance + monthlyContribution) * (1 + monthlyRate);
        accumulatedPrincipal += monthlyContribution;
      }
      assetData.push((currentBalance / pvMag).toFixed(2));
      principalData.push((accumulatedPrincipal / pvMag).toFixed(2));
    }

    const netInterest = currentBalance - accumulatedPrincipal;

    finalValueDisplay.textContent = formatMoneyWithUnit(currentBalance, currency);
    totalPrincipalDisplay.textContent = formatMoneyWithUnit(accumulatedPrincipal, currency);
    totalInterestDisplay.textContent = (netInterest >= 0 ? '+' : '') + formatMoneyWithUnit(netInterest, currency);

    renderChart(labels, assetData, principalData, currency, pvMagText);
  }

  function renderChart(labels, assetData, principalData, currency, pvMagText) {
    const ctx = document.getElementById('growthChart').getContext('2d');
    if (chartInstance) {
      chartInstance.destroy();
    }

    chartInstance = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [
          {
            label: `預估總資產 (${pvMagText} ${currency})`,
            data: assetData,
            borderColor: '#38bdf8',
            backgroundColor: 'rgba(56, 189, 248, 0.15)',
            borderWidth: 3,
            fill: true,
            tension: 0.25,
            pointRadius: 3,
            pointHoverRadius: 6,
            pointBackgroundColor: '#38bdf8'
          },
          {
            label: `累計本金投入 (${pvMagText} ${currency})`,
            data: principalData,
            borderColor: '#94a3b8',
            borderDash: [5, 5],
            borderWidth: 2,
            fill: false,
            tension: 0,
            pointRadius: 0
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { labels: { color: '#cbd5e1', font: { size: 13 } } },
          tooltip: {
            callbacks: {
              label: function(c) {
                return ` ${c.dataset.label}: ${Number(c.raw).toLocaleString()} ${pvMagText} ${currency}`;
              }
            }
          }
        },
        scales: {
          x: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } },
          y: {
            ticks: {
              color: '#94a3b8',
              callback: function(v) { return v.toLocaleString() + ' ' + pvMagText; }
            },
            grid: { color: '#334155' }
          }
        }
      }
    });
  }

  rateSlider.addEventListener('input', (e) => { rateInput.value = e.target.value; calculateTrajectory(); });
  rateInput.addEventListener('input', (e) => { rateSlider.value = e.target.value; calculateTrajectory(); });
  yearsSlider.addEventListener('input', (e) => { yearsInput.value = e.target.value; calculateTrajectory(); });
  yearsInput.addEventListener('input', (e) => { yearsSlider.value = e.target.value; calculateTrajectory(); });
  pvInput.addEventListener('input', calculateTrajectory);
  pmtInput.addEventListener('input', calculateTrajectory);
  currencySelect.addEventListener('change', calculateTrajectory);
  pvMagnitudeSelect.addEventListener('change', calculateTrajectory);
  pmtMagnitudeSelect.addEventListener('change', calculateTrajectory);

  // --- 分頁二：目標倒推計算器 (Goal Solver) ---
  function calculateGoal() {
    const mode = document.getElementById('goalMode').value;
    const targetFv = (parseFloat(document.getElementById('targetFvInput').value) || 0) * parseFloat(document.getElementById('targetFvMagnitude').value);
    const pv = (parseFloat(document.getElementById('goalPvInput').value) || 0) * parseFloat(document.getElementById('goalPvMagnitude').value);
    const years = parseFloat(document.getElementById('goalYearsInput').value) || 1;
    const totalMonths = years * 12;

    const dynamicLabel = document.getElementById('goalDynamicLabel');
    const pmtContainer = document.getElementById('goalPmtInputContainer');
    const rateContainer = document.getElementById('goalRateInputContainer');
    const resTitle = document.getElementById('goalResultTitle');
    const resPrimary = document.getElementById('goalResultPrimary');
    const resSub = document.getElementById('goalResultSub');

    if (targetFv <= pv) {
      resTitle.textContent = "目前現有資金已達到或超越目標金額";
      resPrimary.textContent = "已達標！";
      resSub.textContent = `現有資金已有 ${(pv/10000).toFixed(1)} 萬，目標為 ${(targetFv/10000).toFixed(1)} 萬。`;
      return;
    }

    if (mode === 'solveRate') {
      dynamicLabel.textContent = "每月預計定期定額投入";
      pmtContainer.style.display = "flex";
      rateContainer.style.display = "none";

      const pmt = (parseFloat(document.getElementById('goalPmtInput').value) || 0) * parseFloat(document.getElementById('goalPmtMagnitude').value);

      function calcFutureVal(annualR) {
        const mRate = annualR / 12;
        let bal = pv;
        for (let m = 0; m < totalMonths; m++) {
          bal = (bal + pmt) * (1 + mRate);
        }
        return bal;
      }

      let low = -0.05, high = 5.0; // 擴展二分法搜尋上限至 500%
      let iter = 0;
      let foundR = 0;

      while (iter < 80) {
        let mid = (low + high) / 2;
        let fvMid = calcFutureVal(mid);
        if (Math.abs(fvMid - targetFv) < 1) {
          foundR = mid;
          break;
        }
        if (fvMid < targetFv) {
          low = mid;
        } else {
          high = mid;
        }
        foundR = mid;
        iter++;
      }

      const reqRate = (foundR * 100).toFixed(1);
      resTitle.textContent = `在 ${years} 年內達到目標所需的年化投資報酬率：`;
      resPrimary.textContent = `${reqRate} %`;

      let marketHint = "";
      if (foundR <= 0.04) marketHint = "定存或高評級債券即可達成。";
      else if (foundR <= 0.09) marketHint = "可透過全球大盤型 ETF (如 VT) 達成。";
      else if (foundR <= 0.12) marketHint = "接近標普 500 或台股大盤指數的長期年化水準。";
      else if (foundR <= 0.18) marketHint = "需要科技龍頭指數 (如 QQQ) 等高成長資產方可實現。";
      else marketHint = "要求報酬極高，建議增加每月定期定額金額或延長投資年數以降低波動風險。";

      resSub.textContent = `現有 ${(pv/10000).toLocaleString()} 萬，每月固定投入 ${(pmt/10000).toLocaleString()} 萬。標的提示：${marketHint}`;

    } else {
      dynamicLabel.textContent = "預期年化報酬率 (%)";
      pmtContainer.style.display = "none";
      rateContainer.style.display = "block";

      const expRate = (parseFloat(document.getElementById('goalExpectedRate').value) || 0) / 100;
      const mRate = expRate / 12;

      const pvFuture = pv * Math.pow(1 + mRate, totalMonths);
      const remainingTarget = targetFv - pvFuture;

      if (remainingTarget <= 0) {
        resTitle.textContent = "單靠初始本金自然複利即可達標！";
        resPrimary.textContent = "$0 / 月";
        resSub.textContent = `在年化 ${(expRate*100).toFixed(1)}% 複利下，本金 ${(pv/10000).toLocaleString()} 萬在第 ${years} 年自然成長為 ${(pvFuture/10000).toFixed(1)} 萬。`;
        return;
      }

      let reqPmt = 0;
      if (mRate === 0) {
        reqPmt = remainingTarget / totalMonths;
      } else {
        const factor = (1 + mRate) * (Math.pow(1 + mRate, totalMonths) - 1) / mRate;
        reqPmt = remainingTarget / factor;
      }

      resTitle.textContent = `在預期年化 ${(expRate * 100).toFixed(1)}% 下，每個月必須投入：`;
      resPrimary.textContent = reqPmt >= 10000 ? `${(reqPmt / 10000).toFixed(2)} 萬元` : `${Math.round(reqPmt).toLocaleString()} 元`;
      resSub.textContent = `每年固定本金投入 ${(reqPmt * 12 / 10000).toFixed(1)} 萬，${years} 年累計自行提撥 ${(reqPmt * totalMonths / 10000).toFixed(1)} 萬。`;
    }
  }

  // 初始載入
  calculateTrajectory();
  calculateGoal();
</script>
