<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>複利資產成長模擬器</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #0f172a;
      color: #e2e8f0;
      margin: 0;
      padding: 24px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 900px;
      background: #1e293b;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h2 {
      margin-top: 0;
      color: #38bdf8;
      font-size: 24px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }
    .control-group {
      background: #334155;
      padding: 16px;
      border-radius: 10px;
    }
    label {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
    }
    .unit-selectors {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }
    select, input[type="number"] {
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 8px;
      border-radius: 6px;
      font-size: 14px;
      width: 100%;
    }
    input[type="range"] {
      width: 100%;
      margin-top: 8px;
    }
    .summary-card {
      grid-column: span 2;
      background: #0284c7;
      color: #fff;
      padding: 16px 20px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .summary-title {
      font-size: 15px;
      opacity: 0.9;
    }
    .summary-value {
      font-size: 26px;
      font-weight: 700;
    }
    .chart-box {
      position: relative;
      height: 420px;
      width: 100%;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>複利資產動態成長模擬器</h2>

  <div class="grid">
    <!-- 變數一：初始資產設定 -->
    <div class="control-group">
      <label>
        <span>初始資產總額</span>
        <span id="pvDisplay">180 萬</span>
      </label>
      <input type="number" id="pvInput" value="180" min="0" step="any">
      <div class="unit-selectors">
        <select id="currencySelect">
          <option value="TWD">新台幣 (TWD)</option>
          <option value="USD">美元 (USD)</option>
        </select>
        <select id="magnitudeSelect">
          <option value="10000" selected>萬</option>
          <option value="1000000">百萬</option>
          <option value="100000000">億</option>
        </select>
      </div>
    </div>

    <!-- 變數二：年化報酬率 -->
    <div class="control-group">
      <label>
        <span>預期年化報酬率 (CAGR)</span>
        <span id="rateDisplay">25 %</span>
      </label>
      <input type="range" id="rateSlider" min="1" max="50" step="0.5" value="25">
      <input type="number" id="rateInput" value="25" min="0" max="100" step="0.1">
    </div>

    <!-- 變數三：複利年數 -->
    <div class="control-group" style="grid-column: span 2;">
      <label>
        <span>複利計算年數 (Horizon)</span>
        <span id="yearsDisplay">11 年</span>
      </label>
      <input type="range" id="yearsSlider" min="1" max="40" step="1" value="11">
    </div>

    <!-- 總額結果看板 -->
    <div class="summary-card">
      <div>
        <div class="summary-title">最終期滿預估總資產</div>
        <div id="finalDetail" style="font-size: 13px; opacity: 0.85;">經過 11 年複利滾動</div>
      </div>
      <div class="summary-value" id="finalValueDisplay">0</div>
    </div>
  </div>

  <div class="chart-box">
    <canvas id="growthChart"></canvas>
  </div>
</div>

<script>
  const pvInput = document.getElementById('pvInput');
  const currencySelect = document.getElementById('currencySelect');
  const magnitudeSelect = document.getElementById('magnitudeSelect');
  const rateSlider = document.getElementById('rateSlider');
  const rateInput = document.getElementById('rateInput');
  const yearsSlider = document.getElementById('yearsSlider');

  const pvDisplay = document.getElementById('pvDisplay');
  const rateDisplay = document.getElementById('rateDisplay');
  const yearsDisplay = document.getElementById('yearsDisplay');
  const finalValueDisplay = document.getElementById('finalValueDisplay');
  const finalDetail = document.getElementById('finalDetail');

  let chartInstance = null;

  function calculateTrajectory() {
    const rawVal = parseFloat(pvInput.value) || 0;
    const magnitude = parseFloat(magnitudeSelect.value);
    const baseAmount = rawVal * magnitude;
    const rate = (parseFloat(rateInput.value) || 0) / 100;
    const years = parseInt(yearsSlider.value, 10);
    const currency = currencySelect.value;
    const magText = magnitudeSelect.options[magnitudeSelect.selectedIndex].text;

    pvDisplay.textContent = `${rawVal.toLocaleString()} ${magText} (${currency})`;
    rateDisplay.textContent = `${(rate * 100).toFixed(1)} %`;
    yearsDisplay.textContent = `${years} 年`;

    const labels = [];
    const data = [];

    for (let i = 0; i <= years; i++) {
      labels.push(`第 ${i} 年`);
      const val = baseAmount * Math.pow(1 + rate, i);
      // 以所選單位換算圖表 Y 軸數值
      data.push((val / magnitude).toFixed(2));
    }

    const finalValueTotal = baseAmount * Math.pow(1 + rate, years);
    const finalInUnit = (finalValueTotal / magnitude).toFixed(2);
    finalValueDisplay.textContent = `${Number(finalInUnit).toLocaleString()} ${magText} ${currency}`;
    finalDetail.textContent = `初始資產：${rawVal} ${magText} | 年化：${(rate * 100).toFixed(1)}% | 累積增長：${(finalValueTotal / (baseAmount || 1)).toFixed(2)} 倍`;

    renderChart(labels, data, currency, magText);
  }

  function renderChart(labels, data, currency, magText) {
    const ctx = document.getElementById('growthChart').getContext('2d');
    if (chartInstance) {
      chartInstance.destroy();
    }

    chartInstance = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: `總資產走勢 (${magText} ${currency})`,
          data: data,
          borderColor: '#38bdf8',
          backgroundColor: 'rgba(56, 189, 248, 0.15)',
          borderWidth: 3,
          fill: true,
          tension: 0.25,
          pointRadius: 4,
          pointHoverRadius: 6,
          pointBackgroundColor: '#38bdf8'
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            labels: { color: '#cbd5e1', font: { size: 13 } }
          },
          tooltip: {
            callbacks: {
              label: function(context) {
                return ` 資產淨值: ${Number(context.raw).toLocaleString()} ${magText} ${currency}`;
              }
            }
          }
        },
        scales: {
          x: {
            ticks: { color: '#94a3b8' },
            grid: { color: '#334155' }
          },
          y: {
            ticks: {
              color: '#94a3b8',
              callback: function(value) {
                return value.toLocaleString() + ' ' + magText;
              }
            },
            grid: { color: '#334155' }
          }
        }
      }
    });
  }

  // 雙向綁定與即時事件監聽
  rateSlider.addEventListener('input', (e) => {
    rateInput.value = e.target.value;
    calculateTrajectory();
  });
  rateInput.addEventListener('input', (e) => {
    rateSlider.value = e.target.value;
    calculateTrajectory();
  });
  yearsSlider.addEventListener('input', calculateTrajectory);
  pvInput.addEventListener('input', calculateTrajectory);
  currencySelect.addEventListener('change', calculateTrajectory);
  magnitudeSelect.addEventListener('change', calculateTrajectory);

  // 初始化計算
  calculateTrajectory();
</script>

</body>
</html>
